syntax = "proto3";

package proto;
import "google/protobuf/empty.proto";
option go_package = "github.com/AymenBenyoub/nawst/core/proto";

service KV { 
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (google.protobuf.Empty);
    rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
}

message GetRequest {
    string key = 1 ;
}

message GetResponse {
   
    bytes value = 1;
}

message PutRequest {
    string key=1;
    bytes value =2 ;
}

message DeleteRequest { 
    string key =1 ;
}

