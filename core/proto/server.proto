syntax = "proto3";

package proto;

option go_package = "github.com/AymenBenyoub/nawst/core/proto";

service KVServer { 
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
    string key = 1 ;
}

message GetResponse {
    bool found = 1;
    string value = 2;
}

message PutRequest {
    string key=1;
    string value =2 ;
}

message PutResponse {} // empty, will use grpc status code to indicate success or failure 

message DeleteRequest { 
    string key =1 ;
}

message DeleteResponse { 
    bool existed = 1; 
}