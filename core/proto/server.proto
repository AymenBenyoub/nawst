syntax = "proto3";

package proto;
import "google/protobuf/empty.proto";
option go_package = "github.com/AymenBenyoub/nawst/core/proto";

service KV { 
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (google.protobuf.Empty);
    rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
    rpc Replicate(ReplicationRequest) returns (google.protobuf.Empty);
    rpc StreamKV(stream StreamReq) returns (stream StreamResp);
    rpc TransferVNode(stream VNodeTransferReq) returns (stream VNodeTransferResp);
}

message GetRequest {
    string key = 1 ;
}

message GetResponse {
   
    bytes value = 1;
}

message PutRequest {
    string key=1;
    bytes value =2 ;
}

message DeleteRequest { 
    string key =1 ;
}

message ReplicationRequest {
    Op op =1 ;
    string key = 2;
    bytes value =3;
    uint32 vnode_id = 4;
    uint64 version = 5;
}
enum Op {
    PUT = 0;
    GET = 1;
    DELETE = 2;
}

message StreamReq {
    Op op = 1;
    string key = 2;
    bytes value = 3; // Empty for GET and DELETE
}

message StreamResp {
    Op op = 1;       // So the client knows what is being answered
    bytes value = 2; // Only populated for GET
    string error = 3; 
}

// VNodeTransferReq initiates vnode snapshot transfer.
// Client sends metadata in first message, then receives streaming responses with data.
message VNodeTransferReq {
    uint32 vnode_id = 1;        // Vnode ID to transfer (0..1023)
    uint64 placement_epoch = 2; // Placement epoch for ordering; receiver ignores old epochs
}

// VNodeTransferResp streams snapshot entries from primary to replica.
// Large snapshots are chunked into multiple responses; receiver reassembles.
message VNodeTransferResp {
    uint32 vnode_id = 1;        // Echo of requested vnode ID
    uint64 placement_epoch = 2; // Replicate of request epoch
    
    // Snapshot entry: one (key, value, version) per response message.
    // End-of-stream indicated by empty_entries=true.
    string key = 3;
    bytes value = 4;
    uint64 version = 5;          // Write version for conflict detection during merge
    
    bool empty_entries = 6;      // true = end-of-stream for this vnode; no more entries
    string error = 7;            // Set on error; receiver should abort transfer
    bool tombstone = 8;          // true if entry is a delete marker
}


