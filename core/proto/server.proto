syntax = "proto3";

package proto;
import "google/protobuf/empty.proto";
option go_package = "github.com/AymenBenyoub/nawst/core/proto";

service KV { 
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (google.protobuf.Empty);
    rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
    rpc Replicate(ReplicationRequest) returns (google.protobuf.Empty);
    rpc StreamKV(stream StreamReq) returns (stream StreamResp);
}

message GetRequest {
    string key = 1 ;
}

message GetResponse {
   
    bytes value = 1;
}

message PutRequest {
    string key=1;
    bytes value =2 ;
}

message DeleteRequest { 
    string key =1 ;
}

message ReplicationRequest {
    Op op =1 ;
    string key = 2;
    bytes value =3;
}
enum Op {
    PUT = 0;
    GET = 1;
    DELETE = 2;
}

message StreamReq {
    Op op = 1;
    string key = 2;
    bytes value = 3; // Empty for GET and DELETE
}

message StreamResp {
    Op op = 1;       // So the client knows what is being answered
    bytes value = 2; // Only populated for GET
    string error = 3; 
}

